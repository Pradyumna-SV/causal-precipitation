# Shared defaults. Override specific keys in local.yaml for quick test subsets.

domain:
  lat_min: 24
  lat_max: 50
  lon_min: -125
  lon_max: -100
  grid_resolution: 0.25

nino34_region:              # canonical ENSO SST index region
  lat_min: -5
  lat_max: 5
  lon_min: -170
  lon_max: -120

variables:
  single_level:
    - total_precipitation
    - sea_surface_temperature
    - volumetric_soil_water_layer_1
    - 2m_temperature
  pressure_level:
    - geopotential          # at 500 hPa
    - u_component_of_wind   # at 850 hPa
    - v_component_of_wind   # at 850 hPa
  pressure_levels: [500, 850]

date_range:
  start: "1979-01"
  end:   "2023-12"

extreme_precip_percentile: 90   # threshold for binary extreme event variable

regions:                    # sub-regions for spatial averaging before PCMCI+
  pacific_northwest:
    lat_min: 45
    lat_max: 50
    lon_min: -125
    lon_max: -115
  california:
    lat_min: 32
    lat_max: 40
    lon_min: -125
    lon_max: -115
  intermountain_west:
    lat_min: 37
    lat_max: 45
    lon_min: -115
    lon_max: -105

paths:
  raw_data:    "data/raw/"
  processed:   "data/processed/"
  results:     "results/"
  figures:     "figures/"

# Domain edges for causal **identification** (Pearl backdoor / SCM), merged with
# the data-derived lag-0 structural DAG in script 04. Earlier edges take
# precedence when cycle-breaking drops a candidate link.
identification_backbone:
  edges:
    - [nino34, z500]
    - [nino34, sst]
    - [z500, tp]
    - [sst, tp]
    - [tp, tp_extreme]

inference:
  # Cool-season months (ONDJFM); set to null for full calendar year.
  season_months: [10, 11, 12, 1, 2, 3]
  n_boot: 2000
  # Lighter bootstrap for scripts/robustness_bundle.py (placebos / falsifications).
  robustness_n_boot: 500
  block_size: 12
  # Optional (preset): trim rows whose fitted propensity falls outside these quantiles.
  # null keeps all rows (default).
  ipw_ps_trim_quantiles: null
  # Binariation threshold on Niño 3.4 (K) for theory-aligned secondary estimand.
  nino34_warm_threshold: 0.5
  # Extra IPW estimand: warm Niño vs not (see alternative_estimands in ace JSON).
  report_alternative_estimands: true
  # Optional ACE estimand profile for script 04 (default when omitted).
  # warm_sst_tp_extreme | warm_sst_tp_continuous | nino_tp_extreme | continuous_sst_tp_extreme
  ace_spec:
    profile: warm_sst_tp_extreme

discovery:
  # Match inference mask so PCMCI/VARLiNGAM see the same population (null = all months).
  season_months: [10, 11, 12, 1, 2, 3]

validation:
  temporal_holdout:
    # Frozen confirmation for the primary gate-B claim (see analysis_registry.yaml).
    train_start: "1979-01"
    train_end: "1999-12"
    eval_start: "2000-01"
    eval_end: "2023-12"
    region: pacific_northwest
    n_boot: 2000
